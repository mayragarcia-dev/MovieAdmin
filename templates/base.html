<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portal de Noticias{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="bg-dark text-white py-3">
        <div class="container">
            <h1 class="mb-0">Portal de Noticias</h1>
            <nav class="nav mt-2">
                <a class="nav-link text-white" href="{% url 'home' %}">Inicio</a>
                <a class="nav-link text-white" href="{% url 'admin:index' %}">Admin</a>
            </nav>
        </div>
    </header>

    <main class="container py-4">
        <div class="row">
            <div class="col-md-8">
                {% block content %}
                {% endblock %}
            </div>
            <aside class="col-md-4">
                {% block sidebar %}
                <div class="card">
                    <div class="card-header">
                        <h5>Categorías</h5>
                    </div>
                    <div class="card-body">
                        <p class="text-muted">Barra lateral para categorías y widgets</p>
                    </div>
                </div>
                {% endblock %}
            </aside>
        </div>
    </main>

    <footer class="bg-light py-3 mt-5">
        <div class="container text-center text-muted">
            <small>&copy; 2024 Portal de Noticias. Todos los derechos reservados.</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
