<div class="card mb-3 h-100">
    {% if article.featured_image %}
    <img src="{{ article.featured_image.url }}" class="card-img-top" alt="{{ article.title }}" style="height: 200px; object-fit: cover;">
    {% endif %}
    <div class="card-body d-flex flex-column">
        <h5 class="card-title">{{ article.title }}</h5>
        <p class="card-text text-muted small">
            {% if article.author %}{{ article.author }} • {% endif %}
            {{ article.published_at|date:"d M Y" }}
        </p>
        <p class="card-text flex-grow-1">{{ article.summary|truncatewords:30 }}</p>
        <a href="#" class="btn btn-primary btn-sm mt-auto">Leer más</a>
    </div>
</div>
